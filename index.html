<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPARK — Minimal SMS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05010d;--card:rgba(31,8,55,.85);--border:#45206f;--border2:#8b35c7;
  --cyan:#e879f9;--emerald:#00ff88;--amber:#f59e0b;--red:#ef4444;
  --text:#e2e8f0;--muted:#8b7aa8;--muted2:#4a3a63;
  --mono:ui-monospace,'JetBrains Mono',monospace;
}
html,body{height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(126,34,206,.18),transparent 42%),var(--bg);
  color:var(--text);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;
  display:flex;flex-direction:column;padding:1rem;gap:1rem;user-select:none}
input,textarea,select,button{font-family:inherit;outline:none;border:none;user-select:text}
button{cursor:pointer;color:inherit;background:none;transition:all .2s}

/* TOP BAR */
.top{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{font-size:1.25rem;font-weight:800;letter-spacing:.05em;
  background:linear-gradient(135deg,#fff0a0,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .75rem;border-radius:999px;
  background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.25);font-size:.75rem;font-weight:700;color:var(--emerald);
  box-shadow:0 0 12px rgba(0,255,136,.1)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);box-shadow:0 0 6px var(--emerald);animation:bl 1.8s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}

/* MAIN FORM */
#form{flex:1;display:none;flex-direction:column;gap:1rem;overflow-y:auto;padding-bottom:1rem}
.group{display:flex;flex-direction:column;gap:.4rem}
.row{display:flex;gap:.75rem}
.row>*{flex:1;min-width:0}
.lbl{font-size:.65rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
.inp,.ta{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:.75rem;font-size:.9rem;transition:border-color .2s}
.inp:focus,.ta:focus{border-color:rgba(217,70,239,.5);background:rgba(217,70,239,.04)}
.ta{resize:none;min-height:100px}
.mono{font-family:var(--mono)}

/* BUTTONS */
.btn-send{width:100%;padding:1rem;border-radius:12px;
  background:linear-gradient(135deg,rgba(217,70,239,.2),rgba(139,92,246,.15));
  border:1px solid rgba(217,70,239,.4);color:#fff;font-weight:800;font-size:1rem;
  text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:0 4px 15px rgba(217,70,239,.15);
  display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.5rem}
.btn-send:hover:not(:disabled){background:linear-gradient(135deg,rgba(217,70,239,.3),rgba(139,92,246,.25))}
.btn-send:disabled{opacity:.4;cursor:not-allowed}
.btn-stop{width:100%;padding:1rem;border-radius:12px;
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#f87171;
  font-weight:800;font-size:1rem;box-shadow:0 4px 15px rgba(239,68,68,.15);
  display:none;align-items:center;justify-content:center;gap:.5rem;margin-top:.5rem}

.custom-link{display:block;text-align:center;font-size:.75rem;font-weight:700;color:var(--cyan);
  text-decoration:none;margin-top:1rem;opacity:.8;transition:opacity .2s;cursor:pointer}
.custom-link:hover{opacity:1;text-decoration:underline}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(15,26,48,.95);border:1px solid var(--border2);border-radius:10px;
  padding:.75rem 1.25rem;font-size:.8rem;font-weight:600;opacity:0;transition:all .3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ══════════ LOCK & CUSTOM PAGES ══════════ */
.full-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;
  display:none;flex-direction:column;padding:1rem;overflow-y:auto}
.full-screen.active{display:flex}

/* Pattern Lock Container */
.lock-box{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:1.5rem}
.lock-title{font-size:1.2rem;font-weight:700;color:var(--cyan)}
.lock-sub{font-size:.8rem;color:var(--muted);text-align:center;max-width:250px;line-height:1.4}
#pattern-canvas{border-radius:50%;background:rgba(0,0,0,.2);box-shadow:0 0 30px rgba(0,0,0,.5);touch-action:none}
.lock-key-wrap{width:100%;max-width:300px;margin-top:1rem;display:flex;flex-direction:column;gap:.5rem}

/* Custom Page */
.cp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.cp-title{font-size:1.1rem;font-weight:800;color:var(--cyan)}
.btn-back{padding:.4rem .8rem;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.75rem;font-weight:600}
.btn-back:hover{border-color:var(--border2);color:var(--text)}

.cp-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.8rem;margin-bottom:1rem}
.cp-row{display:flex;gap:.6rem}
.cp-row>*{flex:1}
.cp-btn{padding:.7rem;border-radius:8px;background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3);color:var(--emerald);font-weight:700;font-size:.85rem;cursor:pointer}
.cp-btn:hover{background:rgba(0,255,136,.2)}

.cp-list-wrap{flex:1;border:1px solid var(--border);border-radius:12px;background:rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden}
.cp-list-scroll{overflow-y:auto;flex:1}
.cp-item{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;border-bottom:1px solid var(--border);gap:1rem}
.cp-item:last-child{border-bottom:none}
.cp-item-info{flex:1;min-width:0}
.cp-url{font-family:var(--mono);font-size:.75rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-bottom:.2rem}
.cp-time{font-size:.65rem;color:var(--amber);font-weight:600}
.cp-time.expired{color:var(--red);text-decoration:line-through}
.cp-del{padding:.4rem;border-radius:6px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);flex-shrink:0;cursor:pointer}
.cp-empty{padding:2rem;text-align:center;color:var(--muted2);font-size:.8rem}
</style>
</head>
<body>

<!-- MAIN APP -->
<div id="app" style="display:flex;flex-direction:column;height:100vh;gap:1rem">
  <div class="top">
    <div class="brand">SPARK</div>
    <div class="pill" id="online-pill" style="display:none">
      <span class="dot"></span><span id="online-count">0</span> online
    </div>
  </div>

  <!-- LOADER -->
  <div id="loader" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem">
    <button class="btn-start" id="btn-load" onclick="startLoad()" style="padding:.75rem 2rem;border-radius:10px;background:rgba(217,70,239,.15);border:1px solid rgba(217,70,239,.45);color:var(--cyan);font-weight:700;font-size:.9rem;box-shadow:0 0 15px rgba(217,70,239,.2)">START</button>
    <div id="load-status" style="display:none;font-size:.8rem;color:var(--muted);font-family:var(--mono);text-align:center">
      <div class="spinner" style="width:32px;height:32px;border:3px solid rgba(217,70,239,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem auto"></div>
      <span id="load-text-inner">Initializing…</span>
    </div>
  </div>

  <!-- FORM -->
  <div id="form">
    <div class="row">
      <div class="group">
        <div class="lbl">Number</div>
        <input id="num" class="inp mono" type="tel" placeholder="+91..." autocomplete="off">
      </div>
      <div class="group" style="flex:0.4">
        <div class="lbl">Qty</div>
        <input id="qty" class="inp mono" type="number" value="1" min="1">
      </div>
    </div>

    <div class="group">
      <div class="lbl">Custom SMS</div>
      <textarea id="msg" class="ta" placeholder="Type message..."></textarea>
    </div>

    <div class="group">
      <div class="lbl">SIM</div>
      <select id="sim" class="inp">
        <option value="1">SIM 1</option>
        <option value="2">SIM 2</option>
      </select>
    </div>

    <!-- SEND & STOP BUTTONS JUST BELOW SIM -->
    <button class="btn-send" id="btn-send" onclick="dispatch()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      SEND
    </button>
    
    <button class="btn-stop" id="btn-stop" onclick="stopDispatch()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
      STOP SENDING
    </button>

    <a href="#" class="custom-link" onclick="openCustomPage(event)">RWHUL SIR</a>
  </div>
</div>

<!-- ══════════ CUSTOM URL PAGE ══════════ -->
<div id="custom-page" class="full-screen">
  <div class="cp-header">
    <div class="cp-title">Database URLs</div>
    <button class="btn-back" onclick="closeCustomPage()">← Back to App</button>
  </div>

  <div class="cp-card">
    <div class="lbl">Add Bulk URLs (Comma or Newline separated)</div>
    <textarea id="cp-new-urls" class="ta" style="min-height:80px;font-family:var(--mono);font-size:.75rem" placeholder="https://panel1.firebaseio.com&#10;https://panel2.firebaseio.com"></textarea>
    
    <div class="cp-row">
      <div>
        <div class="lbl">Expire In</div>
        <select id="cp-expire" class="inp" style="font-size:.8rem">
          <option value="1h">1 Hour</option>
          <option value="6h">6 Hours</option>
          <option value="12h">12 Hours</option>
          <option value="24h" selected>24 Hours</option>
          <option value="7d">7 Days</option>
          <option value="30d">30 Days</option>
          <option value="never">Never (No Auto-Delete)</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end">
        <button class="cp-btn" style="width:100%" onclick="addCustomUrls()">Add URLs</button>
      </div>
    </div>
  </div>

  <div class="cp-list-wrap">
    <div class="cp-list-scroll" id="cp-list">
      <div class="cp-empty">No custom URLs added yet.</div>
    </div>
  </div>
</div>

<!-- ══════════ SECURITY LOCK PAGE ══════════ -->
<div id="lock-screen" class="full-screen">
  <div class="lock-box">
    <div class="lock-title" id="lock-title">System Locked</div>
    <div class="lock-sub" id="lock-sub">Draw pattern to unlock</div>
    
    <canvas id="pattern-canvas" width="300" height="300"></canvas>
    
    <div class="lock-key-wrap" id="key-wrap" style="display:none">
      <div class="lbl">Recovery Key</div>
      <input type="password" id="lock-key-input" class="inp mono" placeholder="Enter key...">
      <button class="btn-send" style="padding:.7rem;font-size:.85rem;margin-top:.2rem" onclick="verifyRecoveryKey()">Unlock</button>
    </div>
    
    <a href="#" onclick="toggleKeyRecovery(event)" style="font-size:.75rem;color:var(--muted);margin-top:1rem;text-decoration:underline">Forgot Pattern?</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════════════════════
const DEFAULT_PANELS = [
  "https://chimam-23337-default-rtdb.firebaseio.com",
  "https://ibhaiya-default-rtdb.firebaseio.com",
  "https://sitaya-a4733-default-rtdb.firebaseio.com",
  "https://oct-2733d-default-rtdb.firebaseio.com",
  "https://shrity-481cd-default-rtdb.firebaseio.com",
  "https://ghost-panel-default-rtdb.firebaseio.com",
  "https://chhotu754-442d0-default-rtdb.firebaseio.com",
  "https://apna-kam-bas-default-rtdb.firebaseio.com",
  "https://pogddsszx-default-rtdb.firebaseio.com",
  "https://sabji-d4378-default-rtdb.europe-west1.firebasedatabase.app",
  "https://shivajimaharaj-35881-default-rtdb.firebaseio.com",
  "https://adminzbabu-default-rtdb.firebaseio.com",
  "https://abhi-3-89519-default-rtdb.firebaseio.com",
  "https://nikki-panel-default-rtdb.firebaseio.com",
  "https://trhhtjhtdf-default-rtdb.asia-southeast1.firebasedatabase.app",
  "https://bipin-38a0a-default-rtdb.firebaseio.com",
  "https://roshani-177f4-default-rtdb.firebaseio.com",
  "https://mr-ram-ji-2-default-rtdb.firebaseio.com",
  "https://mkbccc-effb6-default-rtdb.firebaseio.com",
  "https://amramram-d7a15-default-rtdb.firebaseio.com",
  "https://sahil781-59dd4-default-rtdb.firebaseio.com",
  "https://dipika-madam-default-rtdb.firebaseio.com",
  "https://kundam-b2353-default-rtdb.firebaseio.com",
  "https://punamamit-9e27a-default-rtdb.firebaseio.com",
  "https://pillu-a1587-default-rtdb.firebaseio.com",
  "https://amanop5100-754c2-default-rtdb.firebaseio.com",
  "https://darkshadow-f7f4b-default-rtdb.firebaseio.com"
];

let ACTIVE_PANELS = [];
let ALL_DEVICES = [];
let isSending = false;
let abortController = null;

// Security State
let savedPattern = "";
let savedKey = "";
let isSettingPattern = false;
let currentPattern = [];

// Pattern Drawing State
let isDrawing = false;
let drawnNodes = [];
const NODES = 3;
let nodeRadius = 20;
let canvasSize = 300;
let spacing = 0;

function $(id){return document.getElementById(id)}
function toast(m){
  const t=$('toast'); t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// ═══════════════════════════════════════════════════════════
// SECURITY & PATTERN LOCK
// ═══════════════════════════════════════════════════════════
function initSecurity(){
  savedPattern = localStorage.getItem('spark_lock_pattern') || "";
  savedKey = localStorage.getItem('spark_lock_key') || "";
  
  if(savedPattern){
    $('lock-title').textContent = "System Locked";
    $('lock-sub').textContent = "Draw pattern to unlock";
    isSettingPattern = false;
    showLockScreen();
  } else {
    // First time setup
    $('lock-title').textContent = "Setup Pattern Lock";
    $('lock-sub').textContent = "Draw a pattern, then enter a recovery key.";
    isSettingPattern = true;
    showLockScreen();
  }
}

function showLockScreen(){
  $('lock-screen').classList.add('active');
  $('app').style.display = 'none';
  resetPatternCanvas();
}

function hideLockScreen(){
  $('lock-screen').classList.remove('active');
  $('app').style.display = 'flex';
  resetPatternCanvas();
}

function toggleKeyRecovery(e){
  if(e) e.preventDefault();
  const kw = $('key-wrap');
  kw.style.display = kw.style.display === 'none' ? 'flex' : 'none';
}

function verifyRecoveryKey(){
  const input = $('lock-key-input').value;
  if(input === savedKey){
    hideLockScreen();
    toast('Unlocked via recovery key');
  } else {
    toast('Incorrect key');
    $('lock-key-input').value = '';
  }
}

// Canvas Drawing Logic
const canvas = $('pattern-canvas');
const ctx = canvas.getContext('2d');

function resetPatternCanvas(){
  currentPattern = [];
  isDrawing = false;
  drawnNodes = [];
  drawPattern();
  $('key-wrap').style.display = 'none';
  $('lock-key-input').value = '';
  if(isSettingPattern){
    $('lock-title').textContent = "Setup Pattern Lock";
    $('lock-sub').textContent = "Draw a pattern, then enter a recovery key.";
  }
}

function drawPattern(){
  ctx.clearRect(0, 0, canvasSize, canvasSize);
  spacing = canvasSize / (NODES + 1);
  
  // Draw lines
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(232,121,249,0.8)';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  if(currentPattern.length > 1){
    ctx.beginPath();
    const p0 = getNodePos(currentPattern[0]);
    ctx.moveTo(p0.x, p0.y);
    for(let i=1; i<currentPattern.length; i++){
      const p = getNodePos(currentPattern[i]);
      ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
  
  // Draw nodes
  for(let r=0; r<NODES; r++){
    for(let c=0; c<NODES; c++){
      const idx = r*NODES + c;
      const p = getNodePos(idx);
      const isActive = currentPattern.includes(idx);
      
      ctx.beginPath();
      ctx.arc(p.x, p.y, nodeRadius, 0, Math.PI*2);
      ctx.fillStyle = isActive ? 'rgba(232,121,249,0.4)' : 'rgba(255,255,255,0.05)';
      ctx.fill();
      ctx.strokeStyle = isActive ? 'var(--cyan)' : 'rgba(255,255,255,0.1)';
      ctx.stroke();
      
      if(isActive){
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
      }
    }
  }
}

function getNodePos(idx){
  const r = Math.floor(idx / NODES);
  const c = idx % NODES;
  return {
    x: spacing * (c + 1),
    y: spacing * (r + 1)
  };
}

function getTouchedNode(x, y){
  for(let i=0; i<NODES*NODES; i++){
    const p = getNodePos(i);
    const dist = Math.hypot(x - p.x, y - p.y);
    if(dist < nodeRadius * 1.5) return i;
  }
  return -1;
}

function handlePointerStart(e){
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX || e.touches[0].clientX) - rect.left;
  const y = (e.clientY || e.touches[0].clientY) - rect.top;
  
  const idx = getTouchedNode(x, y);
  if(idx >= 0){
    isDrawing = true;
    currentPattern = [idx];
    drawPattern();
  }
}

function handlePointerMove(e){
  if(!isDrawing) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX || e.touches[0].clientX) - rect.left;
  const y = (e.clientY || e.touches[0].clientY) - rect.top;
  
  const idx = getTouchedNode(x, y);
  if(idx >= 0 && !currentPattern.includes(idx)){
    currentPattern.push(idx);
    drawPattern();
  }
}

function handlePointerEnd(e){
  if(!isDrawing) return;
  isDrawing = false;
  
  if(currentPattern.length < 4){
    if(currentPattern.length > 0) toast('Connect at least 4 dots');
    setTimeout(resetPatternCanvas, 600);
    return;
  }
  
  const patternStr = currentPattern.join('-');
  
  if(isSettingPattern){
    // Save pattern step 1
    savedPattern = patternStr;
    $('lock-title').textContent = "Set Recovery Key";
    $('lock-sub').textContent = "Enter a key below to secure the pattern.";
    $('key-wrap').style.display = 'flex';
    $('lock-key-input').value = '';
    $('lock-key-input').placeholder = "New key...";
    
    // Swap button action
    const btn = $('key-wrap').querySelector('button');
    btn.textContent = "Save Lock";
    btn.onclick = function(){
      const key = $('lock-key-input').value.trim();
      if(key.length < 3){ toast('Key too short'); return }
      savedKey = key;
      localStorage.setItem('spark_lock_pattern', savedPattern);
      localStorage.setItem('spark_lock_key', savedKey);
      isSettingPattern = false;
      toast('Lock configured successfully');
      resetPatternCanvas();
    };
  } else {
    // Verify pattern
    if(patternStr === savedPattern){
      hideLockScreen();
      toast('Unlocked');
    } else {
      toast('Incorrect pattern');
      if(navigator.vibrate) navigator.vibrate(100);
      setTimeout(resetPatternCanvas, 600);
    }
  }
}

canvas.addEventListener('mousedown', handlePointerStart);
canvas.addEventListener('mousemove', handlePointerMove);
canvas.addEventListener('mouseup', handlePointerEnd);
canvas.addEventListener('mouseleave', handlePointerEnd);
canvas.addEventListener('touchstart', handlePointerStart, {passive:false});
canvas.addEventListener('touchmove', handlePointerMove, {passive:false});
canvas.addEventListener('touchend', handlePointerEnd);

// Fix canvas to be square on screen
setTimeout(()=>{
  canvas.width = 300; canvas.height = 300; 
  canvasSize = 300;
  drawPattern();
}, 100);

// ═══════════════════════════════════════════════════════════
// CUSTOM URLS SYSTEM
// ═══════════════════════════════════════════════════════════
function getStoredUrls(){
  let stored = [];
  try { stored = JSON.parse(localStorage.getItem('spark_custom_urls') || '[]'); } catch(e){}
  const now = Date.now();
  const valid = stored.filter(item => item.expireAt === 0 || item.expireAt > now);
  if(valid.length !== stored.length){
    localStorage.setItem('spark_custom_urls', JSON.stringify(valid));
  }
  return valid;
}

function saveStoredUrls(arr){
  localStorage.setItem('spark_custom_urls', JSON.stringify(arr));
}

function openCustomPage(e){
  if(e) e.preventDefault();
  $('app').style.display = 'none';
  $('custom-page').classList.add('active');
  renderCustomList();
}

function closeCustomPage(){
  $('custom-page').classList.remove('active');
  $('app').style.display = 'flex';
  updateActivePanels();
}

function addCustomUrls(){
  const raw = $('cp-new-urls').value.trim();
  if(!raw) return;

  const urls = raw.split(/[\n,]+/).map(u => u.trim()).filter(u => u.startsWith('http'));
  if(urls.length === 0){ toast('No valid URLs found'); return }

  const expireVal = $('cp-expire').value;
  let expireAt = 0;
  const now = Date.now();
  
  if(expireVal === '1h') expireAt = now + 3600000;
  else if(expireVal === '6h') expireAt = now + 21600000;
  else if(expireVal === '12h') expireAt = now + 43200000;
  else if(expireVal === '24h') expireAt = now + 86400000;
  else if(expireVal === '7d') expireAt = now + 604800000;
  else if(expireVal === '30d') expireAt = now + 2592000000;

  let stored = getStoredUrls();
  let addedCount = 0;

  for(const u of urls){
    const clean = u.replace(/\/+$/, '');
    if(!stored.find(x => x.url === clean)){
      stored.push({ url: clean, expireAt: expireAt, added: now });
      addedCount++;
    }
  }

  saveStoredUrls(stored);
  $('cp-new-urls').value = '';
  renderCustomList();
  toast(`Added ${addedCount} URLs successfully`);
}

function removeCustomUrl(idx){
  let stored = getStoredUrls();
  stored.splice(idx, 1);
  saveStoredUrls(stored);
  renderCustomList();
}

function renderCustomList(){
  const list = $('cp-list');
  const stored = getStoredUrls();
  const now = Date.now();

  if(stored.length === 0){
    list.innerHTML = '<div class="cp-empty">No custom URLs added yet. Default 27 panels will be used.</div>';
    return;
  }

  list.innerHTML = stored.map((item, i) => {
    let timeText = 'No Expiry';
    let isExpired = false;
    if(item.expireAt > 0){
      const diff = item.expireAt - now;
      if(diff <= 0){ timeText = 'Expired'; isExpired = true; } 
      else {
        const h = Math.floor(diff / 3600000);
        const d = Math.floor(h / 24);
        if(d > 0) timeText = `Expires in ${d}d ${h%24}h`;
        else if(h > 0) timeText = `Expires in ${h}h`;
        else timeText = `Expires in ${Math.floor(diff/60000)}m`;
      }
    }
    return `
      <div class="cp-item">
        <div class="cp-item-info">
          <span class="cp-url" title="${item.url}">${item.url}</span>
          <span class="cp-time ${isExpired ? 'expired' : ''}">${timeText}</span>
        </div>
        <button class="cp-del" onclick="removeCustomUrl(${i})" title="Delete">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
      </div>
    `;
  }).join('');
}

// ═══════════════════════════════════════════════════════════
// CORE LOGIC
// ═══════════════════════════════════════════════════════════
function updateActivePanels(){
  const custom = getStoredUrls();
  ACTIVE_PANELS = custom.length > 0 ? custom.map(x => x.url) : [...DEFAULT_PANELS];
}

async function fbGet(url, path){
  const c=new AbortController(); const timer=setTimeout(()=>c.abort(), 15000);
  try{
    const r=await fetch(url.replace(/\/+$/,'')+'/'+path+'.json',{signal:c.signal});
    clearTimeout(timer);
    if(!r.ok) return null;
    return await r.json();
  }catch(e){clearTimeout(timer);return null;}
}

async function fbPut(url, path, data, signal){
  const c=new AbortController(); 
  const timer=setTimeout(()=>c.abort(), 15000);
  if(signal) signal.addEventListener('abort', () => c.abort());
  try{
    const r=await fetch(url.replace(/\/+$/,'')+'/'+path+'.json',{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data), signal:c.signal
    });
    clearTimeout(timer);
    if(r.status===401||r.status===403) throw new Error('Locked');
    if(!r.ok) throw new Error('HTTP '+r.status);
    return true;
  }catch(e){clearTimeout(timer);throw e;}
}

async function startLoad(){
  updateActivePanels(); 
  const btn=$('btn-load');
  btn.style.display='none';
  $('load-status').style.display='block';
  $('load-text-inner').textContent='Scanning panels in parallel…';

  ALL_DEVICES=[];
  let done=0;

  const promises = ACTIVE_PANELS.map(async (p) => {
    try{
      const data=await fbGet(p,'clients');
      if(data && typeof data==='object'){
        for(const id in data){
          const d=data[id];
          if(d && typeof d==='object' && (d.status||d.isOnline||d.online||d.active)){
            ALL_DEVICES.push({id, panel:p, name:d.name||d.model||id});
          }
        }
      }
    }catch(e){}
    done++;
    $('load-text-inner').textContent=`Scanning panels… ${done}/${ACTIVE_PANELS.length}`;
  });

  await Promise.all(promises);

  const onlineCount=ALL_DEVICES.length;
  $('online-count').textContent=onlineCount;
  $('online-pill').style.display='inline-flex';

  if(onlineCount===0){
    $('load-text-inner').textContent='No online devices found. Try again.';
    btn.style.display='block';
    btn.textContent='RETRY';
    btn.disabled=false;
    return;
  }

  $('loader').style.display='none';
  $('form').style.display='flex';
  checkForm();
}

function checkForm(){
  const n=$('num').value.trim();
  const m=$('msg').value.trim();
  const q=parseInt($('qty').value)||0;
  const ok = n.length>=10 && m.length>0 && q>0 && ALL_DEVICES.length>0 && !isSending;
  $('btn-send').disabled=!ok;
}

['num','msg','qty'].forEach(id=>{
  $(id).addEventListener('input', checkForm);
});

function stopDispatch(){
  if(abortController){
    abortController.abort();
    toast('Dispatch aborted');
  }
}

async function dispatch(){
  if(isSending) return;
  
  const to=$('num').value.trim();
  const msg=$('msg').value.trim();
  const qty=parseInt($('qty').value);
  const sim=parseInt($('sim').value);

  if(!qty || qty < 1) return;
  if(qty > ALL_DEVICES.length){
    toast('Not enough online devices for Qty ' + qty);
    return;
  }

  isSending=true;
  $('btn-send').style.display='none';
  $('btn-stop').style.display='flex';
  
  abortController = new AbortController();
  const signal = abortController.signal;

  // Shuffle and slice exact quantity
  const shuffled = [...ALL_DEVICES].sort(() => Math.random() - 0.5);
  const targets = shuffled.slice(0, qty);

  let success=0, fail=0;

  const tasks = targets.map(async (target) => {
    if(signal.aborted) return;
    try{
      await fbPut(target.panel, `clients/${target.id}/webhookEvent/sendSms`, {
        from: sim, to: to, message: msg, isSended: false, ts: Date.now()
      }, signal);
      success++;
    }catch(e){ 
      if(!signal.aborted) fail++; 
    }
  });

  await Promise.all(tasks);

  if(!signal.aborted){
    toast(`Sent to exactly ${success} devices${fail>0?' ('+fail+' failed)':''}`);
  }
  
  isSending=false;
  abortController = null;
  $('btn-stop').style.display='none';
  $('btn-send').style.display='flex';
  checkForm();
}

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
initSecurity();
updateActivePanels();
</script>
